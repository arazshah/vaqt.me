name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NODE_ENV: test
  DATABASE_URL: postgresql://vaqt:vaqt@localhost:5432/vaqt
  REDIS_URL: redis://localhost:6379
  REDIS_PREFIX: 'vaqt:ci:'
  # 32+ chars, deliberately distinct from the apps/api/.env.example
  # placeholders so a future accidental copy-paste of the example file
  # would not silently pass this exact check.
  OTP_PEPPER: ci-otp-pepper-do-not-use-in-prod-0001
  JWT_ACCESS_SECRET: ci-jwt-access-secret-do-not-use-0001
  JWT_REFRESH_SECRET: ci-jwt-refresh-secret-do-not-use-0001

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: vaqt
          POSTGRES_PASSWORD: vaqt
          POSTGRES_DB: vaqt
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vaqt"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read Node version
        id: node-version
        run: echo "version=$(cat .nvmrc)" >> "$GITHUB_OUTPUT"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.node-version.outputs.version }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Turborepo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-

      - name: Apply database migrations
        run: pnpm --filter @vaqt/db migrate:deploy

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

  e2e:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: vaqt
          POSTGRES_PASSWORD: vaqt
          POSTGRES_DB: vaqt
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vaqt"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    # Deliberately its own job, not a step tacked onto `ci`: unlike the
    # unit/integration suite, this needs the database *seeded* (categories
    # and skills the golden path picks from — the `ci` job above never
    # seeds, on purpose, so its tests don't depend on seed content) and a
    # real Chromium binary, both of which are slow enough to want their own
    # cache and their own pass/fail signal.
    env:
      DATABASE_URL: postgresql://vaqt:vaqt@localhost:5432/vaqt
      REDIS_URL: redis://localhost:6379

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read Node version
        id: node-version
        run: echo "version=$(cat .nvmrc)" >> "$GITHUB_OUTPUT"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.node-version.outputs.version }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Turborepo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-e2e-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-e2e-${{ runner.os }}-

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @vaqt/web exec playwright install --with-deps chromium

      - name: Install Playwright OS dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm --filter @vaqt/web exec playwright install-deps chromium

      - name: Apply database migrations
        run: pnpm --filter @vaqt/db migrate:deploy

      - name: Build workspace packages
        # apps/api's `dev` (ts-node) imports @vaqt/shared and @vaqt/db from
        # their built dist/ output, not source — see CLAUDE.md's build
        # strategy notes. Scoped to just these two (not `pnpm build`, which
        # would also build apps/web/apps/api themselves) since Playwright's
        # webServer runs both apps in dev mode directly. Must run before
        # seeding too: packages/db/src/seed.ts itself imports @vaqt/shared
        # from its built dist/, not source.
        run: pnpm exec turbo run build --filter=@vaqt/shared --filter=@vaqt/db

      - name: Seed database
        run: pnpm db:seed

      - name: E2E
        run: pnpm --filter @vaqt/web test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7
