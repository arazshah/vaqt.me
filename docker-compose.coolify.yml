# Production stack for Coolify ("Docker Compose" build pack, file location:
# /docker-compose.coolify.yml). See docs/DEPLOY-COOLIFY.md.
#
# You configure ONE thing in Coolify: the domain of the `web` service.
# Everything else is generated or wired here:
#   - SERVICE_PASSWORD_* / SERVICE_PASSWORD_64_*  Coolify generates them once
#     and keeps them across redeploys (database password, APP_SECRET).
#   - SERVICE_URL_WEB  becomes the https URL of the domain you set on `web`.
# Anything operational (SMS, Bale bot, templates) is edited later in the app's
# own admin panel, not here.

services:
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        # Empty = the browser calls the same domain; `web` proxies /api and
        # /uploads to `api` over the internal network.
        NEXT_PUBLIC_API_URL: ''
        API_INTERNAL_URL: http://api:3001
    environment:
      # Makes Coolify route the domain you assign to this service to port 3000.
      - SERVICE_URL_WEB_3000
      - WEB_ORIGIN=${SERVICE_URL_WEB}
      - API_INTERNAL_URL=http://api:3001
    depends_on:
      # started, not healthy: if the API ever fails to boot, the deploy still
      # finishes and its container (and logs) stay available in Coolify
      # instead of the whole stack being torn down.
      api:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test:
        ['CMD-SHELL', 'wget -qO- http://127.0.0.1:3000/ >/dev/null || exit 1']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      - NODE_ENV=production
      - PORT=3001
      - SMS_LOGIN_ENABLED=${SMS_LOGIN_ENABLED:-true}
      # One generated secret; the OTP pepper and JWT secrets are derived from
      # it, and it also encrypts the secrets saved in the admin panel. Do not
      # change it after first start (saved secrets would become unreadable).
      - APP_SECRET=${SERVICE_PASSWORD_64_APPSECRET}
      - DATABASE_URL=postgresql://vaqt:${SERVICE_PASSWORD_POSTGRES}@postgres:5432/vaqt
      - WEB_ORIGIN=${SERVICE_URL_WEB}
      # Avatars live in Postgres (stored_files): they survive redeploys with
      # the rest of the data. The disk volume is kept only to keep serving
      # files uploaded before that change.
      - STORAGE_PROVIDER=db
      - LOCAL_STORAGE_DIR=/data/uploads
      # Avatar URLs are served through the web domain (/uploads is proxied).
      - LOCAL_STORAGE_PUBLIC_URL=${SERVICE_URL_WEB}/uploads
      # Optional: the built-in "admin" account's first temporary password.
      # Unset = a random one is printed in this service's log.
      - ADMIN_INITIAL_PASSWORD=${ADMIN_INITIAL_PASSWORD:-}
    volumes:
      - uploads:/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'wget -qO- http://127.0.0.1:3001/api/v1/health >/dev/null || exit 1',
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 90s
    # No published ports: the API is reachable only through `web`.

  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=vaqt
      - POSTGRES_PASSWORD=${SERVICE_PASSWORD_POSTGRES}
      - POSTGRES_DB=vaqt
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U vaqt -d vaqt']
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  pgdata:
  uploads:
